
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>Заявка на разработку — PixelForge</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Заявка на разработку</h1>
            <p>Веб-студия «PixelForge»</p>
        </header>

        <form id="applicationForm" novalidate>
            <div class="form-toolbar">
                <span class="toolbar-label">Заполните форму проекта</span>
                <button type="button" id="fillRandomBtn" class="random-btn">
                    🎲 Заполнить рандомно
                </button>
            </div>

            <fieldset>
                <legend>О заказчике</legend>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">Имя <span>*</span></label>
                        <input type="text" id="firstName" name="firstName"
                               placeholder="Ваше имя" autocomplete="given-name">
                        <span class="error" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Фамилия <span>*</span></label>
                        <input type="text" id="lastName" name="lastName"
                               placeholder="Ваша фамилия" autocomplete="family-name">
                        <span class="error" id="lastNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span>*</span></label>
                        <input type="email" id="email" name="email"
                               placeholder="name@company.com" autocomplete="email">
                        <span class="error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон <span>*</span></label>
                        <input type="tel" id="phone" name="phone"
                               placeholder="+998 __ ___ __ __" autocomplete="tel">
                        <span class="error" id="phoneError"></span>
                    </div>

                    <div class="form-group">
                        <label for="company">Компания</label>
                        <input type="text" id="company" name="company"
                               placeholder="Название компании" autocomplete="organization">
                    </div>

                    <div class="form-group">
                        <label for="position">Должность</label>
                        <input type="text" id="position" name="position"
                               placeholder="CEO, Marketing Manager...">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>О проекте</legend>

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="service">Тип услуги <span>*</span></label>
                        <select id="service" name="service">
                            <option value="">— Выберите услугу —</option>
                            <option value="Лендинг">Лендинг</option>
                            <option value="Корпоративный сайт">Корпоративный сайт</option>
                            <option value="Интернет-магазин">Интернет-магазин</option>
                            <option value="Веб-приложение">Веб-приложение</option>
                            <option value="Мобильное приложение">Мобильное приложение</option>
                            <option value="Дизайн (лого/брендинг)">Дизайн (лого/брендинг)</option>
                        </select>
                        <span class="error" id="serviceError"></span>
                    </div>

                    <div class="form-group">
                        <label for="budget">Бюджет <span>*</span></label>
                        <select id="budget" name="budget">
                            <option value="">— Выберите диапазон —</option>
                            <option value="до 1000$">до 1000$</option>
                            <option value="1000-5000$">1000–5000$</option>
                            <option value="5000-10000$">5000–10000$</option>
                            <option value="10000-25000$">10000–25000$</option>
                            <option value="свыше 25000$">свыше 25000$</option>
                        </select>
                        <span class="error" id="budgetError"></span>
                    </div>

                    <div class="form-group">
                        <label for="deadline">Срок <span>*</span></label>
                        <select id="deadline" name="deadline">
                            <option value="">— Выберите срок —</option>
                            <option value="до 2 недель">до 2 недель</option>
                            <option value="1 месяц">1 месяц</option>
                            <option value="1-2 месяца">1–2 месяца</option>
                            <option value="3+ месяцев">3+ месяцев</option>
                            <option value="не срочно">не срочно</option>
                        </select>
                        <span class="error" id="deadlineError"></span>
                    </div>

                    <div class="form-group">
                        <label for="launchDate">Желаемая дата запуска</label>
                        <input type="date" id="launchDate" name="launchDate">
                    </div>

                    <div class="form-group">
                        <label for="pagesCount">Количество страниц</label>
                        <input type="number" id="pagesCount" name="pagesCount"
                               min="1" max="100" placeholder="Например: 5">
                        <span class="error" id="pagesCountError"></span>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Описание проекта <span>*</span></label>
                        <textarea id="description" name="description" rows="5"
                                  placeholder="Расскажите о целях, аудитории, референсах... (мин. 30 символов)"></textarea>
                        <span class="error" id="descriptionError"></span>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Прочее</legend>

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="website">Ссылка на текущий сайт (если есть)</label>
                        <input type="url" id="website" name="website"
                               placeholder="https://example.com">
                        <span class="error" id="websiteError"></span>
                    </div>

                    <div class="form-group">
                        <label for="source">Как о нас узнали?</label>
                        <select id="source" name="source">
                            <option value="">— Выберите источник —</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Telegram">Telegram</option>
                            <option value="Google">Google</option>
                            <option value="Рекомендация друзей">Рекомендация друзей</option>
                            <option value="Другое">Другое</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contactMethod">Способ связи</label>
                        <select id="contactMethod" name="contactMethod">
                            <option value="">— Выберите способ —</option>
                            <option value="Telegram">Telegram</option>
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="Email">Email</option>
                            <option value="Телефон">Телефон</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">Отправить заявку</button>

            <p class="form-note">
                Обязательные поля отмечены звёздочкой (*).<br>
                После отправки данные попадут в Google Sheets,
                а в Telegram придёт уведомление о заявке.
            </p>
        </form>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
